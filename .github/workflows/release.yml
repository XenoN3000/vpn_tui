name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use git ref)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            bin: vpn_tui
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            platform: macos-x86_64
            bin: vpn_tui
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            bin: vpn_tui
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bin: vpn_tui.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix Release Archive
        if: runner.os != 'Windows'
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG#refs/tags/}"
          VERSION="${VERSION//\//-}"
          PKG_NAME="vpn_tui-${VERSION}-${{ matrix.platform }}"
          STAGING="staging/${PKG_NAME}"
          
          mkdir -p "${STAGING}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${STAGING}/"
          chmod +x "${STAGING}/${{ matrix.bin }}"
          cp README.md LICENSE "${STAGING}/"
          
          tar -czf "${PKG_NAME}.tar.gz" -C staging "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          
          mkdir -p artifacts
          mv "${PKG_NAME}.tar.gz" "${PKG_NAME}.tar.gz.sha256" artifacts/

      - name: Package Windows Release Archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rawTag = "${{ inputs.tag_name || github.ref_name }}"
          $version = ($rawTag -replace '^refs/tags/', '') -replace '/', '-'
          $pkgName = "vpn_tui-$version-${{ matrix.platform }}"
          $staging = "staging/$pkgName"
          
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" -Destination $staging
          Copy-Item "README.md", "LICENSE" -Destination $staging
          
          Compress-Archive -Path $staging -DestinationPath "$pkgName.zip"
          $hash = (Get-FileHash -Path "$pkgName.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkgName.zip" | Out-File -FilePath "$pkgName.zip.sha256" -Encoding ascii
          
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Move-Item "$pkgName.zip", "$pkgName.zip.sha256" -Destination artifacts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate Consolidated Checksums
        working-directory: dist
        run: |
          echo "=== Downloaded Artifacts ==="
          ls -la
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          echo "=== Consolidated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-alpha') || contains(inputs.tag_name || github.ref_name, '-beta') || contains(inputs.tag_name || github.ref_name, '-rc') }}
