[package]
name = "vpn_tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A terminal user interface for managing OpenConnect and OpenVPN connections on Linux"
authors = ["Hosein Nahari <hosein.nahari1000@gmail.com>"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
futures-util = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
