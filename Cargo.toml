[package]
name = "vpn_tui"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A terminal user interface for managing OpenConnect and OpenVPN connections on Linux"
authors = ["Hosein Nahari <hosein.nahari1000@gmail.com>"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
futures-util = "0.3"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies"] }
png = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
